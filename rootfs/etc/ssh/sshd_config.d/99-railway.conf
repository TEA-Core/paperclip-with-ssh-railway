# Paperclip + SSH Railway image — hardened sshd config.
# Key-only authentication, no passwords, no root login.

PasswordAuthentication no
PermitEmptyPasswords no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

PermitRootLogin no
MaxAuthTries 3
LoginGraceTime 30

ClientAliveInterval 300
ClientAliveCountMax 2
Protocol 2

# Don't reveal version banner
DebianBanner no

# Logging
LogLevel INFO
SyslogFacility AUTH

# AcceptEnv kept narrow — Railway env vars are inherited via with-contenv anyway
AcceptEnv LANG LC_*
