[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# s6-overlay supervises both the Paperclip server and sshd
healthcheckPath = "/setup/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Note: Railway exposes one HTTP proxy and (separately) TCP proxies via the
# dashboard. Configure these in the service settings:
#   - HTTP proxy → port 3100  (Paperclip web)
#   - TCP proxy  → port 22    (SSH)
# Volume must be mounted at /paperclip.
